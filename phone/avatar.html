<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101114">
<title>RaspiTV – Profilbild</title>
<style>
  :root { --bg: #101114; --card: #1d1f24; --text: #e8eaed; --muted: #9aa0a6; --blue: #8ab4f8; --red: #f28b82; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
         font-family: "Nunito Sans", system-ui, -apple-system, sans-serif; display: flex; justify-content: center; }
  main { width: 100%; max-width: 420px; padding: 28px 16px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  h1 { margin: 0; font-size: 1.5rem; }
  p { margin: 0; color: var(--muted); text-align: center; line-height: 1.4; }
  .preview { width: 220px; height: 220px; border-radius: 50%; background: var(--card); overflow: hidden;
             display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 3rem; }
  .preview canvas { width: 100%; height: 100%; display: block; }
  label.button, button { width: 100%; border: 0; border-radius: 14px; padding: 16px; font: inherit; font-weight: 700;
                         font-size: 1.05rem; text-align: center; cursor: pointer; }
  label.button { background: var(--card); color: var(--text); }
  button { background: var(--blue); color: #10223f; }
  button:disabled { opacity: 0.4; }
  input[type=file] { display: none; }
  .msg { min-height: 1.4em; font-weight: 600; }
  .msg.err { color: var(--red); }
  .msg.ok { color: #81c995; }
</style>
</head>
<body>
<main>
  <h1>Profilbild für RaspiTV</h1>
  <p>Wähle ein Foto. Es wird quadratisch zugeschnitten und gleich am Fernseher übernommen.</p>
  <div class="preview" id="preview">🙂</div>
  <label class="button" for="file">Foto auswählen</label>
  <input type="file" id="file" accept="image/*">
  <button id="send" disabled>Übernehmen</button>
  <div class="msg" id="msg"></div>
</main>
<script>
  // Einmal-Schlüssel aus dem QR-Code (#t=…); er gilt nur, solange am Fernseher die Auswahl offen ist.
  const token = new URLSearchParams(location.hash.slice(1)).get("t") || "";
  const $ = (id) => document.getElementById(id);
  const SIZE = 480;
  let blob = null;

  function say(text, kind) { $("msg").textContent = text; $("msg").className = "msg " + (kind || ""); }
  if (!token) say("Bitte den QR-Code am Fernseher scannen.", "err");

  $("file").addEventListener("change", async () => {
    const file = $("file").files[0];
    if (!file) return;
    say("");
    try {
      // Mitte quadratisch ausschneiden und verkleinern (Ausrichtung des Handys beachtet der Browser selbst)
      const bitmap = await createImageBitmap(file);
      const side = Math.min(bitmap.width, bitmap.height);
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = SIZE;
      canvas.getContext("2d").drawImage(bitmap, (bitmap.width - side) / 2, (bitmap.height - side) / 2, side, side,
                                        0, 0, SIZE, SIZE);
      $("preview").replaceChildren(canvas);
      blob = await new Promise((done) => canvas.toBlob(done, "image/jpeg", 0.9));
      $("send").disabled = !blob || !token;
    } catch (e) {
      say("Dieses Bild lässt sich nicht öffnen.", "err");
    }
  });

  $("send").addEventListener("click", async () => {
    if (!blob) return;
    $("send").disabled = true;
    say("Wird übertragen …");
    try {
      const r = await fetch("/avatar", { method: "POST", headers: { "X-Upload": token, "Content-Type": "image/jpeg" }, body: blob });
      const data = await r.json().catch(() => ({}));
      if (r.ok) say("Fertig – schau auf den Fernseher.", "ok");
      else { say(data.error || "Hat nicht geklappt.", "err"); $("send").disabled = false; }
    } catch (e) {
      say("Keine Verbindung zum Fernseher.", "err");
      $("send").disabled = false;
    }
  });
</script>
</body>
</html>
